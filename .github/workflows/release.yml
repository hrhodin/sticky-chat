name: Release

# A tag publishes. `workflow_dispatch` is there so the build can be exercised
# without publishing anything: run it with dry-run left on and every step
# happens except the upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build

      # Catches metadata that PyPI would reject after the upload has started,
      # which is the expensive place to find out.
      - run: twine check --strict dist/*

      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A tag publishes; a manual run only publishes when dry-run is turned off.
    if: github.event_name == 'push' || inputs.dry-run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC token, so no
      # API token is stored anywhere. The PyPI project must name this
      # repository and workflow as a trusted publisher first, or the upload
      # is rejected.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
